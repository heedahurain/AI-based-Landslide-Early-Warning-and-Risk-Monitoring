# Field sensor telemetry broker.
#
# Anonymous access is enabled for local development only. Before any field
# deployment, switch to per-device credentials or client certificates: a sensor
# feed that anyone can publish to is a feed that anyone can use to fake a
# landslide signal.
listener 1883
allow_anonymous true

# WebSocket listener so the browser can subscribe directly during debugging.
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
